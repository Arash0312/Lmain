<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Free Daily Cases — Mini App</title>

  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/font-face.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --neon:#00eaff;
      --neon-opacity:0.2;
      --text:#fff;
    }

    body{
      margin:0;
      padding:20px;
      background:#060606;
      font-family:"Vazir",sans-serif;
      color:var(--text);
      display:flex;
      justify-content:center;
    }

    .card{
      width:100%;
      max-width:420px;
      background:rgba(255,255,255,0.04);
      padding:26px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,0.05);
      backdrop-filter:blur(14px);
      position:relative;
    }

    /* mute button */
    #music-toggle{
      position:absolute;
      right:14px;
      top:14px;
      width:44px;
      height:44px;
      border:none;
      border-radius:12px;
      background:rgba(255,255,255,0.07);
      color:#fff;
      font-size:18px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* header */
    h1{
      margin-top:60px;
      text-align:center;
      font-family:"Playfair Display",serif;
      font-size:30px;
      font-weight:700;
      background:linear-gradient(90deg,#b8e8ff,#e5f9ff);
      -webkit-background-clip:text;
      color:transparent;
      letter-spacing:1.5px;
    }

    .links{
      display:flex;
      flex-direction:column;
      gap:16px;
      margin-top:20px;
    }

    /* BUTTON */
    .btn{
      position:relative;
      display:block;
      text-decoration:none;
      color:#fff;
      background:rgba(255,255,255,0.05);
      padding:14px;
      text-align:center;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.05);
      font-weight:600;
      transition:0.2s;
    }

    .btn:hover{
      transform:translateY(-3px);
      background:rgba(255,255,255,0.08);
    }

    /* neon under buttons */
    .btn::after{
      content:"";
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom:-10px;
      width:80%;
      height:14px;
      border-radius:20px;
      background:linear-gradient(90deg,rgba(0,234,255,0),var(--neon),rgba(0,234,255,0));
      filter:blur(12px);
      opacity:var(--neon-opacity);
      transition:0.2s;
    }

    .btn:hover::after{
      opacity:0.35;
      bottom:-12px;
    }

    /* update box */
    .update-box{
      margin-top:22px;
      text-align:center;
      font-size:14px;
      color:#ccc;
      background:rgba(255,255,255,0.05);
      padding:10px;
      border-radius:12px;
    }

    /* SIGNATURE — FIXED */
    .signature{
      margin-top:26px;
      text-align:center;
    }

    .signature .note{
      font-size:13px;
      opacity:0.7;
      margin-bottom:6px;
    }

    .signature .handle{
      display:inline-block;
      padding:8px 16px;
      border-radius:30px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.06);
      backdrop-filter:blur(6px);
      font-weight:700;
      letter-spacing:0.8px;
      background:linear-gradient(90deg,#99f7ff,#85ffe6,#c4ffe8);
      -webkit-background-clip:text;
      color:transparent;
    }
  </style>
</head>

<body>

  <main class="card">

    <button id="music-toggle">🔊</button>

    <h1>Free Daily Cases</h1>

    <section class="links">
      <a class="btn" href="https://t.me/epic_gift_bot/app?startapp=ref_-gqCyA" target="_blank">Epic Gifts</a>
      <a class="btn" href="https://t.me/Grab_Giftsbot/grabgifts?startapp=ref_5438078953" target="_blank">Grab Gifts</a>
      <a class="btn" href="https://t.me/onecase_play_bot/app?startapp=BF0245DA" target="_blank">OneCase</a>
      <a class="btn" href="https://t.me/GorillaCaseBot/app?startapp=r_5438078953" target="_blank">GorillaCase</a>
      <a class="btn" href="https://t.me/majesticgamebot?startapp=r5438078953" target="_blank">MajesticGame</a>
      <a class="btn" href="https://t.me/virus_play_bot/app?startapp=roulette_inviteCode64R0dNCbdgzrOlTy" target="_blank">Virus</a>
      <a class="btn" href="https://t.me/mellgifts_bot/app?startapp=LNJBIyLx" target="_blank">MellGifts</a>
      <a class="btn" href="https://t.me/ChanceAppBot/play?startapp=ref5438078953" target="_blank">ChanceApp</a>
    </section>

    <audio id="bg-music" src="narvent_-_fainted.mp3" preload="auto" loop></audio>

    <div class="update-box">✨ بزودی آپدیت‌های بیشتر</div>

    <div class="signature">
      <div class="note">به‌روزترین کیس‌ها و جوایز روزانه</div>
      <div class="handle">@ArshBemola</div>
    </div>

  </main>

  <script>
    const music = document.getElementById("bg-music");
    const toggle = document.getElementById("music-toggle");

    // Try to autoplay
    window.addEventListener("load", () => {
      music.play().catch(() => {});
    });

    // Play on first user interaction (required by browsers)
    document.body.addEventListener("click", () => {
      music.play().catch(() => {});
    }, { once: true });

    toggle.addEventListener("click", () => {
      if (music.paused){
        music.play();
        toggle.textContent = "🔇";
      } else {
        music.pause();
        toggle.textContent = "🔊";
      }
    });
  </script>

</body>
</html>
