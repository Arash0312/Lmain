<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Free Daily Cases — Mini App</title>

  <!-- Fonts: Vazir for body, Playfair Display (stylish) for header -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/font-face.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#050506;
      --card: rgba(18,18,20,0.72);
      --text:#EEF2F5;
      --muted:#9aa3ab;
      --btn-bg:#141416;
      --btn-border: rgba(255,255,255,0.03);
      --neon: #1ea7ff;       /* رنگ نئونی زیر دکمه (می‌تونی به #9b5cff یا #00f0c5 تغییر بدی) */
      --neon-opacity: 0.18;  /* شدت نور */
      --accent: #ffd89b;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      padding:28px 16px;
      background: linear-gradient(180deg, #040405 0%, #070708 100%);
      font-family: "Vazir", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:var(--text);
      display:flex;
      justify-content:center;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Card */
    .card{
      width:100%;
      max-width:420px;
      background:var(--card);
      border-radius:20px;
      padding:26px;
      position:relative;
      border:1px solid rgba(255,255,255,0.03);
      backdrop-filter: blur(14px) saturate(120%);
      box-shadow: 0 18px 60px rgba(0,0,0,0.6);
      overflow:hidden;
    }

    /* Mute button */
    #music-toggle{
      position:absolute;
      top:14px;
      right:14px;
      width:44px;
      height:44px;
      border-radius:12px;
      border:none;
      background: rgba(255,255,255,0.04);
      color:var(--text);
      font-size:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      backdrop-filter: blur(6px);
      transition: background .18s ease, transform .12s ease;
    }
    #music-toggle:hover{ background: rgba(255,255,255,0.08); transform:translateY(-2px); }

    /* Header: different font + style */
    header h1{
      margin:52px 0 18px;
      font-family: "Playfair Display", serif;
      font-weight:700;
      font-size:28px;
      line-height:1;
      color:var(--accent);
      text-align:center;
      letter-spacing: -0.6px;
      /* subtle soft halo for depth without being neon */
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    .links{ display:flex; flex-direction:column; gap:14px; margin-top:6px; }

    /* buttons */
    .btn{
      position:relative;
      display:block;
      width:100%;
      padding:14px 16px;
      border-radius:14px;
      text-decoration:none;
      color:var(--text);
      font-weight:600;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid var(--btn-border);
      text-align:center;
      transition: transform .16s ease, background .18s ease;
      overflow:visible;
    }

    .btn:active{ transform: translateY(0.5px); }

    .btn:hover{
      background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.02));
      transform: translateY(-3px);
    }

    /* NEON glow under the button (subtle, only under) */
    .btn::after{
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: -10px;               /* فاصله از پایین دکمه */
      width: 84%;                  /* پهناى هاله — کمتر از دکمه تا لبه‌ها بیرون نزنه */
      height: 14px;                /* ارتفاع هاله */
      border-radius: 10px;
      background: linear-gradient(90deg, rgba(30,167,255,0.0), var(--neon), rgba(30,167,255,0.0));
      filter: blur(12px);
      opacity: var(--neon-opacity);
      pointer-events:none;
      transition: opacity .18s ease, transform .18s ease;
    }

    /* stronger on hover but still subtle */
    .btn:hover::after{
      opacity: calc(var(--neon-opacity) * 1.6);
      transform: translateX(-50%) translateY( -2px );
    }

    /* small inner line to separate buttons visually */
    .btn + .btn{ margin-top: 0; }

    /* update box */
    .update-box{
      margin-top:22px;
      padding:14px;
      border-radius:12px;
      background: rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.03);
      color:var(--muted);
      text-align:center;
      font-size:14px;
      letter-spacing: 0.2px;
    }

    /* bottom special signature - gradient text + icon */
    .signature{
      margin-top:18px;
      text-align:center;
      display:flex;
      flex-direction:column;
      gap:6px;
      align-items:center;
    }

    .signature .note{
      font-size:14px;
      color:var(--muted);
      letter-spacing:0.3px;
    }

    .signature .handle{
      font-family: "Inter", system-ui;
      font-weight:700;
      font-size:16px;
      background: linear-gradient(90deg, #9be15d 0%, #00f5a0 50%, #00d2ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing:0.6px;
      padding:6px 14px;
      border-radius:999px;
      border: 1px solid rgba(255,255,255,0.03);
      backdrop-filter: blur(6px);
    }

    /* responsive tweaks */
    @media (max-width:420px){
      header h1{ font-size:22px; margin-top:36px; }
      .btn{ padding:12px; font-size:15px; border-radius:12px; }
      .btn::after{ bottom:-8px; height:12px; width:86%; filter: blur(10px); }
    }
  </style>
</head>
