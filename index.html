<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Free Daily Cases — Mini App</title>

  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/font-face.css" rel="stylesheet">

  <style>
    :root{
      --dark-bg1: #1a1a1a;
      --dark-bg2: #0f0f0f;
      --accent-orange: #ff7f50;
      --glow-orange: #ff6600;
      --text: #fff;
    }

    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;
      padding:0;
      font-family: "Vazir", "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:var(--text);
      background: url('./ChatGPT Image Dec 11, 2025, 02_40_17 PM.png') no-repeat center top fixed;
      background-size: cover;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      min-height:100vh;
    }

    .overlay {
      width:100%;
      min-height:100vh;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.85) 100%);
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:28px 16px;
    }

    .card {
      width:100%;
      max-width:400px;
      margin-top:30px;
      border-radius:20px;
      background: linear-gradient(180deg, var(--dark-bg1), var(--dark-bg2));
      border: 1px solid rgba(255,127,80,0.25);
      box-shadow: 0 12px 50px rgba(0,0,0,0.7), 0 0 40px rgba(255,127,80,0.2) inset;
      padding:20px;
      backdrop-filter: blur(12px) saturate(1.2);
      transition: transform 0.3s ease;
    }
    .card:hover{
      transform: translateY(-2px);
    }

    header h1{
      margin:8px 0 12px;
      font-size:32px;
      color:var(--accent-orange);
      letter-spacing:1px;
      text-shadow: 0 0 20px #ff7f5088;
      font-weight:800;
      text-align:center;
    }

    .links {
      margin-top:16px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .btn {
      display:inline-block;
      width:100%;
      padding:14px 16px;
      border-radius:14px;
      text-decoration:none;
      font-weight:700;
      font-size:16px;
      color:#fff;
      background: linear-gradient(90deg, var(--glow-orange), #ff3300);
      box-shadow: 0 0 10px var(--glow-orange), 0 0 20px rgba(255,102,0,0.5);
      border: 1px solid rgba(255,255,255,0.03);
      text-align:center;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      animation: neonBlink 2s infinite alternate;
    }

    @keyframes neonBlink {
      0% { box-shadow: 0 0 10px var(--glow-orange), 0 0 20px rgba(255,102,0,0.5);}
      50% { box-shadow: 0 0 20px var(--glow-orange), 0 0 40px rgba(255,102,0,0.8);}
      100% { box-shadow: 0 0 10px var(--glow-orange), 0 0 20px rgba(255,102,0,0.5);}
    }

    .btn:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .update-box{
      margin-top:20px;
      padding:12px;
      border-radius:12px;
      background: rgba(18,18,30,0.6);
      border: 1px dashed rgba(255,127,80,0.2);
      text-align:center;
      color: #ffd9b3;
      font-size:15px;
      box-shadow: 0 6px 28px rgba(255,100,0,0.25) inset;
    }

    footer{
      margin-top:16px;
      text-align:center;
      font-size:14px;
      color:rgba(255,255,255,0.88);
    }
    footer a{ color: #ffb87f; text-decoration:none; font-weight:700 }
    footer a:hover{ text-decoration:underline }

    .music-control {
      margin:15px 0;
      text-align:center;
    }

    .music-btn {
      display:inline-block;
      padding:8px 16px;
      border-radius:12px;
      background: linear-gradient(90deg, #ff7f50, #ff4500);
      color:#fff;
      font-weight:700;
      cursor:pointer;
      text-shadow: 0 0 5px #ff7f50;
      box-shadow: 0 0 10px #ff7f50, 0 0 20px rgba(255,127,80,0.5);
      transition: all 0.3s ease;
    }
    .music-btn:hover{
      transform: scale(1.1);
      box-shadow: 0 0 15px #ff7f50, 0 0 30px rgba(255,127,80,0.7);
    }

    @media (max-width:420px){
      header h1{ font-size:28px }
      .btn{ font-size:15px; padding:12px }
      .card{ margin-top:24px; padding:18px }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <main class="card" role="main" aria-label="Free Daily Cases">
      <header>
        <h1>Free Daily Cases</h1>
      </header>

      <section class="links" aria-label="links">
        <a class="btn" href="https://t.me/epic_gift_bot/app?startapp=ref_-gqCyA" target="_blank" rel="noopener">Epic Gifts</a>
        <a class="btn" href="https://t.me/Grab_Giftsbot/grabgifts?startapp=ref_5438078953" target="_blank" rel="noopener">Grab Gifts</a>
        <a class="btn" href="http://t.me/onecase_play_bot/app?startapp=BF0245DA" target="_blank" rel="noopener">OneCase</a>
        <a class="btn" href="https://t.me/GorillaCaseBot/app?startapp=r_5438078953" target="_blank" rel="noopener">GorillaCase</a>
        <a class="btn" href="https://t.me/majesticgamebot?startapp=r5438078953" target="_blank" rel="noopener">MajesticGame</a>
        <a class="btn" href="https://t.me/virus_play_bot/app?startapp=roulette_inviteCode64R0dNCbdgzrOlTy" target="_blank" rel="noopener">Virus</a>
        <a class="btn" href="http://t.me/mellgifts_bot/app?startapp=LNJBIyLx" target="_blank" rel="noopener">MellGifts</a>
        <a class="btn" href="https://t.me/ChanceAppBot/play?startapp=ref5438078953" target="_blank" rel="noopener">ChanceApp</a>
      </section>

      <div class="music-control">
        <audio id="bg-music" src="narvent_-_fainted.mp3" loop></audio>
        <button class="music-btn" id="music-toggle">Play🔊</button>
      </div>

      <div class="update-box">More updates coming soon ✨</div>

      <footer>
        Telegram Channel: <a href="https://t.me/ArshBemola" target="_blank" rel="noopener">@ArshBemola</a>
      </footer>
    </main>
  </div>

  <script>
    const music = document.getElementById('bg-music');
    const toggleBtn = document.getElementById('music-toggle');

    toggleBtn.addEventListener('click', () => {
      if(music.paused){
        music.play();
        toggleBtn.textContent = '🔇';
      } else {
        music.pause();
        toggleBtn.textContent = '🔊';
      }
    });
  </script>
</body>
</html>
