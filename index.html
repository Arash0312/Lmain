<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini App</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/font-face.css" rel="stylesheet">

<style>

:root{
  --bg: #050506;
  --card: rgba(20,20,24,0.65);
  --text: #ffffff;
  --border: rgba(255,255,255,0.06);
  --btn-bg: #1d1d22;
  --btn-hover: #26262b;
  --muted: #b9b9b9;

  /* نور خیلی ظریف */
  --soft-glow: rgba(0,0,0,0.55);
}

*{box-sizing:border-box;}
body{
  margin:0;
  padding:0;
  background:var(--bg);
  font-family:"Vazir", system-ui;
  color:var(--text);
  display:flex;
  justify-content:center;
  padding-top:30px;
}

.card{
  width:100%;
  max-width:420px;
  padding:26px;
  border-radius:20px;
  background:var(--card);
  backdrop-filter: blur(18px) saturate(130%);
  border:1px solid var(--border);
  position:relative;
  box-shadow: 0 15px 60px rgba(0,0,0,0.55);
}

/* دکمه میوت */
#music-toggle{
  position:absolute;
  top:14px;
  right:14px;
  width:42px;
  height:42px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  color:var(--text);
  font-size:20px;
  cursor:pointer;
  backdrop-filter:blur(6px);
  transition:0.2s;
}
#music-toggle:hover{
  background:rgba(255,255,255,0.12);
}

h1{
  margin:55px 0 18px;
  text-align:center;
  font-size:26px;
  font-weight:800;
  letter-spacing:-0.5px;
  color:var(--text);
}

.links{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-top:20px;
}

/* دکمه‌های شیک با نور زیرین */
.btn{
  display:block;
  padding:14px;
  border-radius:14px;
  background:var(--btn-bg);
  border:1px solid var(--border);
  color:var(--text);
  font-weight:600;
  text-align:center;
  text-decoration:none;

  /* نور نرم زیر دکمه */
  box-shadow:
    0 4px 12px var(--soft-glow),
    0 1px 0 rgba(255,255,255,0.03) inset;

  transition:0.25s;
}
.btn:hover{
  background:var(--btn-hover);
  box-shadow:
    0 6px 18px rgba(0,0,0,0.6),
    0 1px 0 rgba(255,255,255,0.05) inset;
  transform:translateY(-1px);
}

.update-box{
  margin-top:22px;
  padding:14px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

footer{
  margin-top:18px;
  text-align:center;
  font-size:13px;
  color:var(--muted);
}
footer a{
  color:var(--text);
  text-decoration:none;
  font-weight:600;
}

</style>
</head>

<body>

<main class="card">

  <!-- mute btn -->
  <button id="music-toggle">🔇</button>

  <h1>Free Daily Cases</h1>

  <section class="links">
    <a class="btn" href="#">Epic Gifts</a>
    <a class="btn" href="#">Grab Gifts</a>
    <a class="btn" href="#">OneCase</a>
    <a class="btn" href="#">GorillaCase</a>
    <a class="btn" href="#">MajesticGame</a>
    <a class="btn" href="#">Virus</a>
    <a class="btn" href="#">MellGifts</a>
    <a class="btn" href="#">ChanceApp</a>
  </section>

  <audio id="bg-music" src="narvent_-_fainted.mp3" loop></audio>

  <div class="update-box">More updates coming soon…</div>

  <footer>Telegram: <a href="https://t.me/ArshBemola">@ArshBemola</a></footer>

</main>

<script>
const music = document.getElementById("bg-music");
const toggle = document.getElementById("music-toggle");

window.addEventListener("load", ()=> {
  music.play().catch(()=>{});
});

toggle.addEventListener("click", ()=>{
  if(music.paused){
    music.play();
    toggle.textContent="🔇";
  }else{
    music.pause();
    toggle.textContent="🔊";
  }
});
</script>

</body>
</html>
