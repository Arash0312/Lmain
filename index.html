<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Free Daily Cases — Mini App</title>

  <!-- فونت فارسی و انگلیسی (Vazir + Poppins) -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/font-face.css" rel="stylesheet">

  <style>
    :root{
      --neon-1: #7d8bff;
      --neon-2: #4b54d6;
      --glass-bg: rgba(18,20,30,0.55);
      --glass-border: rgba(111,125,255,0.25);
      --accent: #8fa2ff;
      --text: #ffffff;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      padding:0;
      font-family: "Vazir", "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:var(--text);
      background: url('./ChatGPT Image Dec 11, 2025, 02_40_17 PM.png') no-repeat center top fixed;
      background-size: cover;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      min-height:100vh;
    }

    .overlay {
      width:100%;
      min-height:100vh;
      background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.65) 100%);
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:28px 16px;
    }

    .card {
      width:100%;
      max-width:400px;
      margin-top:30px;
      border-radius:20px;
      background: linear-gradient(180deg, rgba(12,14,24,0.6), rgba(10,12,20,0.5));
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 50px rgba(7,9,20,0.7), 0 0 50px rgba(79,92,255,0.08) inset;
      padding:20px;
      backdrop-filter: blur(12px) saturate(1.2);
      transition: transform 0.3s ease;
    }
    .card:hover{
      transform: translateY(-2px);
    }

    header h1{
      margin:8px 0 12px;
      font-size:32px;
      color:var(--accent);
      letter-spacing:1px;
      text-shadow: 0 0 20px #7f95ff88;
      font-weight:800;
      text-align:center;
    }

    .links {
      margin-top:16px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .btn {
      display:inline-block;
      width:100%;
      padding:14px 16px;
      border-radius:14px;
      text-decoration:none;
      font-weight:700;
      font-size:16px;
      color:#fff;
      background: linear-gradient(90deg, var(--neon-1), var(--neon-2));
      box-shadow: 0 8px 20px rgba(75,84,214,0.22), 0 0 20px rgba(120,140,255,0.16);
      border: 1px solid rgba(255,255,255,0.03);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      text-align:center;
    }

    .btn:active{ transform: translateY(1px) }
    .btn:hover{
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 45px rgba(75,84,214,0.32), 0 0 40px rgba(120,140,255,0.22);
      filter:brightness(1.05);
    }

    .update-box{
      margin-top:20px;
      padding:12px;
      border-radius:12px;
      background: rgba(18,18,30,0.5);
      border: 1px dashed rgba(111,125,255,0.15);
      text-align:center;
      color: #dfe8ff;
      font-size:15px;
      box-shadow: 0 6px 28px rgba(30,40,90,0.2) inset;
    }

    footer{
      margin-top:16px;
      text-align:center;
      font-size:14px;
      color:rgba(255,255,255,0.88);
    }
    footer a{ color: #bfc9ff; text-decoration:none; font-weight:700 }
    footer a:hover{ text-decoration:underline }

    @media (max-width:420px){
      header h1{ font-size:28px }
      .btn{ font-size:15px; padding:12px }
      .card{ margin-top:24px; padding:18px }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <main class="card" role="main" aria-label="Free Daily Cases">
      <header>
        <h1>Free Daily Cases</h1>
      </header>

      <section class="links" aria-label="links">
        <a class="btn" href="https://t.me/epic_gift_bot/app?startapp=ref_-gqCyA" target="_blank" rel="noopener">Epic Gifts</a>
        <a class="btn" href="https://t.me/Grab_Giftsbot/grabgifts?startapp=ref_5438078953" target="_blank" rel="noopener">Grab Gifts</a>
        <a class="btn" href="http://t.me/onecase_play_bot/app?startapp=BF0245DA" target="_blank" rel="noopener">OneCase</a>
        <a class="btn" href="https://t.me/GorillaCaseBot/app?startapp=r_5438078953" target="_blank" rel="noopener">GorillaCase</a>
        <a class="btn" href="https://t.me/majesticgamebot?startapp=r5438078953" target="_blank" rel="noopener">MajesticGame</a>
        <a class="btn" href="https://t.me/virus_play_bot/app?startapp=roulette_inviteCode64R0dNCbdgzrOlTy" target="_blank" rel="noopener">Virus</a>
        <a class="btn" href="http://t.me/mellgifts_bot/app?startapp=LNJBIyLx" target="_blank" rel="noopener">MellGifts</a>
        <a class="btn" href="https://t.me/ChanceAppBot/play?startapp=ref5438078953" target="_blank" rel="noopener">ChanceApp</a>
      </section>

      <div class="update-box">More updates coming soon ✨</div>

      <footer>
        Telegram Channel: <a href="https://t.me/ArshBemola" target="_blank" rel="noopener">@ArshBemola</a>
      </footer>
    </main>
  </div>
</body>
</html>
