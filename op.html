<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mini App Entrance</title>

<!-- Fonts -->
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/font-face.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
:root {
  --neon-main: #ff9f00;
  --bg-dark: #0a0a0a;
  --text-color: #ffffff;
}

/* Reset */
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; background: radial-gradient(circle at top, #0a0a0a, #050505); font-family:"Vazir",sans-serif; color:var(--text-color); }
body { display:flex; justify-content:center; align-items:center; padding:12px 0; }

/* Card container */
.card {
  width:92%;
  max-width:440px;
  background: rgba(255,255,255,0.04);
  padding:36px 24px;
  border-radius:28px;
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(16px);
  box-shadow:0 0 60px rgba(0,0,0,0.7);
  position:relative;
  overflow:hidden;
  text-align:center;
}

/* Animated background lights */
.card::before {
  content:"";
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle, var(--neon-main) 0%, transparent 60%);
  animation: pulseBg 3s ease-in-out infinite alternate;
  opacity:0.2;
  z-index:-1;
}

@keyframes pulseBg {
  0% { transform:scale(1); opacity:0.15; }
  50% { transform:scale(1.2); opacity:0.25; }
  100% { transform:scale(1); opacity:0.15; }
}

/* Header */
h1 {
  font-family:"Playfair Display", serif;
  font-size:32px;
  font-weight:700;
  letter-spacing:1.6px;
  margin-bottom:40px;
  background: linear-gradient(90deg, var(--neon-main), #ffd78a);
  -webkit-background-clip:text;
  color:transparent;
}

/* Buttons container */
.links {
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* Buttons design */
.btn {
  position:relative;
  display:block;
  padding:18px;
  font-size:18px;
  font-weight:700;
  text-decoration:none;
  color:var(--text-color);
  background: rgba(255,159,0,0.15);
  border-radius:20px;
  border:1px solid rgba(255,159,0,0.4);
  overflow:hidden;
  box-shadow:0 0 25px rgba(255,159,0,0.5), inset 0 0 12px rgba(255,159,0,0.2);
  transition: all 0.35s ease;
}

/* Neon pulse effect */
.btn::before {
  content:"";
  position:absolute;
  inset:-20%;
  background: conic-gradient(from 0deg, transparent, var(--neon-main), transparent);
  filter: blur(14px);
  opacity:0.4;
  animation: rotateBtn 4s linear infinite;
  z-index:-1;
}

@keyframes rotateBtn { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }

.btn span {
  position:relative;
  z-index:1;
}

/* Featured button more glow */
.featured {
  box-shadow:0 0 40px rgba(255,159,0,0.6), inset 0 0 18px rgba(255,159,0,0.25);
}

/* Back button small */
.back {
  position:absolute;
  top:14px;
  left:14px;
  font-size:14px;
  padding:6px 12px;
  border-radius:12px;
  text-decoration:none;
  color:#fff;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
}

/* Remove footer text */
</style>
</head>

<body>
<main class="card">

  <a class="back" href="#">← Back</a>

  <h1>Mini App Hub</h1>

  <section class="links">
    <a class="btn featured" href="app.index" target="_blank"><span>Free Gifts Case</span></a>
    <a class="btn featured" href="appp.index" target="_blank"><span>Crush Game</span></a>
  </section>

</main>
</body>
</html>
