<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #f4f4f4;
            border-bottom: 1px solid #ddd;
        }
        .header button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .header button:hover {
            background-color: #0056b3;
        }
        img {
            max-width: 100%;
            height: auto;
            margin-top: 20px;
        }
        .image-name {
            margin: 20px 0;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="header">
        <button onclick="history.back()">Go Back</button>
        <h1>Btc Usdt</h1>
    </div>

    <div>
        <!-- Replace 'image.jpg' with the actual name of your image file -->
        <img src="Picsart_25-01-03_19-37-08-293.jpg" alt="Image">
        <div class="image-name">ساعت معرفی: ۲۱:۰۰ در ۱۴ دی ۱۴۰۳</div>
    </div>

</body>
</html>
