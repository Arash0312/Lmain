<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* دو ستون در هر ردیف */
            gap: 20px;
            justify-items: center;
        }

        .button-container {
            width: 100%;
        }

        .main-btn {
            width: 200px;
            height: 70px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .main-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #34495e, #2c3e50);
        }

        .main-btn:active {
            transform: translateY(2px);
        }

        .button-link {
            text-decoration: none;
            color: white;
            display: block;
            height: 100%;
            width: 100%;
            text-align: center;
            line-height: 70px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="button-container">
            <button class="main-btn">
                <a href="button1.html" class="button-link">Kaisar'A'</a>

        </div>

        </div>
        <div class="button-container">

                <a href="button4.html" class="button-link">Humanity'C'</a>
            </button>
        </div>
        <div class="button-container">
            <button class="main-btn">
                <a href="button5.html" class="button-link">Open Loop'A'</a>
            </button>
        </div>
        <div class="button-container">
            <button class="main-btn">
                <a href="button6.html" class="button-link">Tea Fi'A'</a>
            </button>
        </div>
        <div class="button-container">

        <div class="button-container">
