<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Free Daily Cases — Mini App</title>

  <!-- Fonts -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/font-face.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="card">

  <!-- Music Toggle -->
  <button id="music-toggle" aria-label="Toggle music">🔊</button>

  <!-- Header -->
  <h1>Free Daily Cases</h1>

  <!-- Buttons -->
  <section class="links">

    <!-- FEATURED / VIP -->
    <a class="btn featured" href="https://t.me/OilTycoonTON_bot/game?startapp=ii_5438078953" target="_blank">
      Free Ton Miner
      <span class="badge">HOT</span>
      <span class="ring"></span> <!-- حلقه نئونی چرخان -->
    </a>

    <a class="btn" href="https://t.me/epic_gift_bot/app?startapp=ref_-gqCyA" target="_blank">Epic Gifts</a>
    <a class="btn" href="https://t.me/onecase_play_bot/app?startapp=BF0245DA" target="_blank">OneCase</a>
    <a class="btn" href="https://t.me/GorillaCaseBot/app?startapp=r_5438078953" target="_blank">GorillaCase</a>
    <a class="btn" href="https://t.me/majesticgamebot?startapp=r5438078953" target="_blank">MajesticGame</a>
    <a class="btn" href="https://t.me/virus_play_bot/app?startapp=roulette_inviteCode64R0dNCbdgzrOlTy" target="_blank">Virus</a>
    <a class="btn" href="https://t.me/mellgifts_bot/app?startapp=LNJBIyLx" target="_blank">MellGifts</a>
    <a class="btn" href="https://t.me/ChanceAppBot/play?startapp=ref5438078953" target="_blank">ChanceApp</a>

  </section>

  <!-- Background Music -->
  <audio id="bg-music" src="narvent_-_fainted.mp3" preload="auto" loop></audio>

  <!-- Update -->
  <div class="update-box">✨ More updates coming soon</div>

  <!-- Signature -->
  <div class="signature">
    <div class="note">Latest cases and daily rewards</div>
    <div class="handle">
      <a href="https://t.me/ArshBemola" target="_blank">ArshBemola</a>
    </div>
  </div>

</main>

<script>
  const music = document.getElementById("bg-music");
  const toggle = document.getElementById("music-toggle");

  let isPlaying = false;

  function playMusic() {
    music.play().then(() => {
      isPlaying = true;
      toggle.textContent = "🔊";
    }).catch(() => {});
  }

  function pauseMusic() {
    music.pause();
    isPlaying = false;
    toggle.textContent = "🔇";
  }

  // Toggle button
  toggle.addEventListener("click", (e) => {
    e.stopPropagation();
    isPlaying ? pauseMusic() : playMusic();
  });

  // Mobile autoplay unlock
  document.body.addEventListener("click", () => {
    if (!isPlaying) playMusic();
  }, { once: true });

  toggle.textContent = "🔇";
</script>

</body>
</html>
